<div class="ai-chat-card">
  <div class="chat-header">
    <div class="header-info">
      <div class="bot-avatar">
        <img src="icons/bot.svg" alt="AI Bot" class="bot-img-icon" />
      </div>
      <div>
        <h4>Weather AI Assistant</h4>
        <p>MCP Agent Assistant</p>
      </div>
    </div>

    <div class="header-actions">
      <button
        type="button"
        class="clear-chat-btn"
        (click)="onClear()"
        [disabled]="clearing() || thinking()"
        title="Clear conversation and database records"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          <line x1="10" y1="11" x2="10" y2="17"/>
          <line x1="14" y1="11" x2="14" y2="17"/>
        </svg>
        <span>{{ clearing() ? 'Clearing...' : 'Clear Chat' }}</span>
      </button>
    </div>
  </div>

  <div class="chat-messages" #messagesContainer>
    @for (msg of messages(); track $index) {
      <div class="message-bubble" [class.user-bubble]="msg.sender === 'user'" [class.assistant-bubble]="msg.sender === 'assistant'">
        <div class="bubble-header">
          <span class="sender-name">{{ msg.sender === 'user' ? 'You' : 'Weather MCP Bot' }}</span>
          <span class="msg-time">{{ msg.time }}</span>
        </div>
        <p class="bubble-text">{{ msg.text }}</p>
      </div>
    }

    @if (thinking()) {
      <div class="message-bubble assistant-bubble thinking-bubble">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
      </div>
    }
  </div>

  <form class="chat-input-form" (ngSubmit)="send()">
    <input
      type="text"
      [(ngModel)]="inputText"
      name="chatQuery"
      placeholder="Ask weather (e.g. Bangalore, Mumbai vs Delhi)"
      [disabled]="thinking() || clearing()"
    />
    <button type="submit" class="send-btn" [disabled]="thinking() || clearing() || !inputText().trim()">
      <img src="icons/send.svg" alt="Send" class="send-img-icon" />
    </button>
  </form>
</div>

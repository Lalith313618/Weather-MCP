<div class="login-wrapper">
  <div class="login-card form-card">
    <div class="auth-tabs">
      <button
        type="button"
        class="auth-tab active"
      >
        Login
      </button>
      <button
        type="button"
        class="auth-tab"
        (click)="openRegister()"
      >
        Register
      </button>
    </div>

    @if (errorMessage()) {
      <div class="alert-banner">
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <form class="login-form" (ngSubmit)="handleLogin()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-container">
          <img src="icons/mail.svg" alt="Email" class="input-icon" />
          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            [(ngModel)]="email"
            name="email"
            required
            autocomplete="email"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-container">
          <img src="icons/lock.svg" alt="Password" class="input-icon" />
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            required
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-pwd-btn"
            (click)="togglePasswordVisibility()"
            aria-label="Toggle password visibility"
          >
            @if (showPassword()) {
              <img src="icons/eye-off.svg" alt="Hide password" class="toggle-icon" />
            } @else {
              <img src="icons/eye.svg" alt="Show password" class="toggle-icon" />
            }
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
          <span class="custom-checkbox"></span>
          <span>Remember me</span>
        </label>
      </div>

      <button type="submit" class="submit-btn" [disabled]="loading()">
        @if (loading()) {
          <span class="spinner"></span>
          <span>Signing In...</span>
        } @else {
          <span>Sign In</span>
          <img src="icons/arrow-right.svg" alt="Continue" class="arrow-icon" />
        }
      </button>
    </form>

    <div class="card-footer">
      <p>
        Don't have an account? <a href="javascript:void(0)" class="signup-link" (click)="openRegister()">Register Now</a>
      </p>
    </div>
  </div>
</div>
